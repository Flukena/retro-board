server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # frame-ancestors 'none' replaces X-Frame-Options for modern browsers, but
    # keep both so older clients (curl-based probes, IE) still see DENY.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP — inline styles are allowed because the app sets them via React
    # style={{ }} everywhere; eval and inline scripts are not. data:/blob:
    # img sources cover pasted/imported PNGs. ws: + wss: cover the yjs relay
    # whether reached over http or via the cloudflared /yjs proxy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # HSTS only meaningful when terminated TLS upstream (cloudflared). Safe
    # default; browsers ignore it over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA fallback — every non-asset path returns index.html so React Router
    # (or any client-side routing) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed Vite assets (file names include a content hash).
    # Do not add add_header here: nginx would stop inheriting server security headers.
    location /assets/ {
        access_log off;
        expires 1y;
    }

    # Compress text payloads on the fly.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Strip nginx version from error pages / Server header.
    server_tokens off;
}
